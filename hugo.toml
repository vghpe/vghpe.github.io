baseURL = "https://vghpe.github.io/"
title = "henrik docs"
timeZone = "Europe/Stockholm"
relativeURLs = false
canonifyURLs = true
languageCode = 'en-us'
ignoreFiles = ['_templates', '/[Uu]ntitled']
summaryLength = 45
[pagination]
  pagerSize = 12
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
[params]
bio = "Game Design · Systems · Narrative · Art"
hiddenPostSummaryInHomePage = false
enableRSS = true
subscribe = "RSS"
showPowerBy = false
author = "Henrik Pettersson"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'rose-pine-dawn'
    lineNumbersInTable = false
    lineNos = false

[permalinks]
  # slug when set (titled posts), else filename (IndieKit hash-named posts).
  # The filename is the slug IndieKit generates, so /sketchbook/<hash>/ matches
  # the URL IndieKit reports when publishing.
  sketchbook = "/sketchbook/:slugorfilename/"
