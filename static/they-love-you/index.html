<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>They Love You</title>
<meta name="description" content="A small top-down arcade game from 2012, back in the browser.">
<meta property="og:title" content="They Love You">
<meta property="og:description" content="A small top-down arcade game from 2012, back in the browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://vghpe.github.io/they-love-you/">
<meta property="og:image" content="https://vghpe.github.io/images/posts/love-you/header.gif">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* The game's own font (the in-game HUD uses it too). */
  @font-face { font-family: "C64"; src: url("C64.ttf") format("truetype"); font-display: swap; }

  :root {
    /* The game is square: as big as fits between the title and the links. */
    --game: clamp(280px, min(100vw - 32px, 100vh - 240px), 960px);

    /* The stripes, as in the margin around the map in the game: the floor's dark stripe
       layer (floor_tex_lines.png, rgb 22,45,45 on black), four per map width, each 28% of
       its period, scrolling sideways; here darker, thicker and slower. --stripe-scale sizes
       them against the game's own (1 = continuous with the game's margin); --stripe-width is
       the band's share of its period (the game's: 0.28); --stripe-seconds is the time to
       scroll one stripe along (the game takes 5 s). */
    --stripe-scale: 1.5;
    --stripe-width: 0.45;
    --stripe-seconds: 40s;
    --stripe-color: rgb(13, 27, 27);
    --period: calc(var(--game) * 512 / 576 / 4 * var(--stripe-scale));  /* along a row */
    --across: calc(var(--period) * 0.7071);  /* square to the stripes, at 45 degrees */
  }
  @supports (height: 100dvh) {
    :root { --game: clamp(280px, min(100vw - 32px, 100dvh - 240px), 960px); }
  }

  html { background: #000; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px 16px 20px;
    box-sizing: border-box;
    color: #fff;
    font: 12px/1.6 "C64", ui-monospace, monospace;
    letter-spacing: 0.5px;
  }

  /* One period wider than the screen, slid left by one period and around again: seamless. */
  body::before {
    content: "";
    position: fixed;
    top: 0; bottom: 0; left: 0;
    right: calc(-1 * var(--period));
    z-index: -1;
    pointer-events: none;
    background: repeating-linear-gradient(45deg,
      var(--stripe-color) 0, var(--stripe-color) calc(var(--across) * var(--stripe-width)),
      transparent calc(var(--across) * var(--stripe-width)), transparent var(--across));
    animation: scroll var(--stripe-seconds) linear infinite;
  }
  @keyframes scroll {
    to { transform: translateX(calc(-1 * var(--period))); }
  }
  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
  }
  html.shader body::before { display: none; }

  /* The EarthBound-style backgrounds: a WebGL canvas drawn at about 224 lines, like the
     SNES, and scaled up with hard pixel edges. */
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: none;
  }
  html.shader #bg { display: block; }

  h1 { margin: 0; line-height: 0; }
  h1 img { width: min(var(--game), 420px); height: auto; }

  #game {
    width: var(--game);
    height: var(--game);
    background: #000;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
  }
  #game iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #game iframe.ready { opacity: 1; }

  .links { text-align: center; }
  .sep { color: rgba(255, 255, 255, 0.35); margin: 0 0.6em; }
  a, button.link { color: #f19ba3; text-decoration: none; }
  a:hover, a:focus-visible, button.link:hover, button.link:focus-visible { text-decoration: underline; }
  button.link { font: inherit; letter-spacing: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  html.still body::before { animation-play-state: paused; }

  footer { color: rgba(255, 255, 255, 0.45); font-size: 10px; text-align: center; }
  footer a { color: rgba(255, 255, 255, 0.7); }

  /* The ?debug panel for the Waves background. */
  #debug {
    position: fixed; top: 10px; right: 10px; z-index: 10;
    width: 270px; max-height: calc(100vh - 20px); overflow-y: auto;
    padding: 10px 12px; box-sizing: border-box;
    background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.2);
    font: 11px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 0; color: #ddd;
  }
  #debug small { color: #888; }
  #debug > small { display: block; margin-top: 6px; }
  #debug .head { margin: 10px 0 4px; color: #ffd23f; }
  #debug label { display: grid; grid-template-columns: 76px 1fr 56px; align-items: center; gap: 6px; }
  #debug input[type=range] { width: 100%; }
  #debug input[type=color] { width: 100%; height: 18px; padding: 0; border: 0; background: none; }
  #debug label span { text-align: right; color: #aaa; }
  #debug .buttons { display: flex; gap: 6px; margin-top: 10px; }
  #debug button { flex: 1; font: inherit; color: #fff; background: #333; border: 1px solid #555; padding: 4px 0; cursor: pointer; }
  #debug button:hover { background: #444; }
  #debug button[aria-pressed="true"] { background: #5a4a12; border-color: #ffd23f; color: #ffd23f; }

  /* Background picker (for trying them out). */
  #picker { font-size: 10px; text-align: center; color: rgba(255, 255, 255, 0.45); }
  #picker button {
    font: inherit;
    color: rgba(255, 255, 255, 0.6);
    background: none;
    border: 0;
    padding: 0 0.4em;
    cursor: pointer;
  }
  #picker button:hover { color: #fff; }
  #picker button[aria-pressed="true"] { color: #ffd23f; }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <h1><img src="logo.png" width="680" height="219" alt="They Love You"></h1>

  <div id="game">
    <iframe id="frame" title="They Love You" scrolling="no" allowfullscreen></iframe>
  </div>

  <div class="links">
    <a href="/posts/they-love-you/">About the game</a>
    <span class="sep">·</span>
    <a id="rules" href="?design=classic">Play the original version</a>
    <span class="sep">·</span>
    <button id="dynamic" type="button" class="link">Disable dynamic background</button>
  </div>

  <footer>
    © 2012, 2026 Henrik Pettersson, Paul Annesley, Zac Duff ·
    <a href="https://vghpe.github.io/">vghpe.github.io</a>
  </footer>


<script>
  // The game itself is the same build the blog post embeds (/games/they-love-you/, published
  // by tools/publish-web.sh in the game's repo). This page's query passes on to it, so
  // ?design=classic plays the 2012 rules here too.
  var frame = document.getElementById("frame");
  var classic = /(^|[?&])design=classic(&|$)/.test(location.search);

  // The game's page is white until the game draws; show it once loaded, see-through, so the
  // loading bar sits on black here instead of flashing white (same origin, so this is allowed).
  frame.addEventListener("load", function () {
    try {
      var doc = frame.contentDocument;
      doc.documentElement.style.background = doc.body.style.background = "transparent";
    } catch (e) {}
    frame.classList.add("ready");
  });
  // Everything but this page's own ?bg= goes on to the game.
  var params = new URLSearchParams(location.search);
  var gameParams = new URLSearchParams(location.search);
  gameParams.delete("bg");
  gameParams.delete("preset");
  gameParams.set("logo", "off");  // the title is on this page already
  frame.src = "/games/they-love-you/" + (gameParams.toString() ? "?" + gameParams : "");

  var rules = document.getElementById("rules");
  function updateRulesLink() {
    var p = new URLSearchParams(location.search);
    if (classic) p.delete("design"); else p.set("design", "classic");
    rules.href = p.toString() ? "?" + p : "./";
  }
  if (classic) {
    rules.textContent = "Play the new version";
    document.title = "They Love You (2012 rules)";
  }
  updateRulesLink();
</script>

<script>
  // Backgrounds. "stripes" is the CSS one above; the rest are EarthBound-style battle
  // backgrounds: one fragment shader each, a stepped palette that cycles over time, and the
  // SNES scanline tricks: horizontal wave (each line shifted by a sine of its height),
  // interlaced wave (odd and even lines shifted opposite ways), vertical wave (lines pulled
  // up and down), and two layers mixed half and half. Waves is the one in use; ?bg=NAME picks
  // another, and the picker (hidden) keeps the address up to date without reloading the game.
  (function () {
    var LINES = 224;  // the canvas's height in pixels (SNES: 224); Waves sets its own

    var COMMON = [
      "#ifdef GL_FRAGMENT_PRECISION_HIGH",
      "precision highp float;",
      "#else",
      "precision mediump float;",
      "#endif",
      "uniform vec2 res;",
      "uniform float t;",
      "vec3 rgb(int r, int g, int b) { return vec3(float(r), float(g), float(b)) / 255.0; }",
      // Four colours as equal steps, repeating every 1.0 of x: palette cycling is x + time.
      "vec3 pick4(float x, vec3 a, vec3 b, vec3 c, vec3 d) {",
      "  x = fract(x) * 4.0;",
      "  return x < 1.0 ? a : x < 2.0 ? b : x < 3.0 ? c : d;",
      "}",
      // Pixel position, y down, whole pixels.
      "vec2 pix() { return floor(vec2(gl_FragCoord.x, res.y - gl_FragCoord.y)); }",
      ""
    ].join("\n");

    var BACKGROUNDS = [
      { name: "stripes", label: "Stripes" },

      // The game's diagonal stripes in four palette steps, bent by the SNES scanline tricks:
      // two horizontal sways, an interlaced sway (odd and even lines opposite ways) and a
      // vertical wave. Every setting is a uniform (WAVES below), tunable with ?debug.
      { name: "waves", label: "Waves", update: updateWaves, glsl: [
        "uniform float band, angle, pal, lineStep, bright;",
        "uniform vec2 drift;",
        "uniform vec3 swayA, swayB, inter, vert;  // amplitude, frequency, phase",
        "uniform vec3 c0, c1, c2, c3;",
        "void main() {",
        "  vec2 p = pix();",
        "  float ly = floor(p.y / lineStep) * lineStep;  // lines move in groups of lineStep",
        "  float dx = swayA.x * sin(ly * swayA.y + swayA.z) + swayB.x * sin(ly * swayB.y + swayB.z);",
        "  dx += (mod(p.y, 2.0) * 2.0 - 1.0) * inter.x * sin(ly * inter.y + inter.z);",
        "  float dy = vert.x * sin(ly * vert.y + vert.z);",
        "  vec2 q = p + vec2(dx, dy) + drift;",
        "  float s = dot(q, vec2(cos(angle), sin(angle))) / band - pal;",
        "  gl_FragColor = vec4(pick4(s, c0, c1, c2, c3) * bright, 1.0);",
        "}"
      ] },

      // Concentric diamonds in purple and pink, odd and even lines waving opposite ways.
      { name: "interlace", label: "Interlace", glsl: [
        "void main() {",
        "  vec2 p = pix();",
        "  float odd = mod(p.y, 2.0) * 2.0 - 1.0;",
        "  vec2 q = vec2(p.x + odd * 14.0 * sin(p.y * 0.035 + t * 1.4) + t * 6.0, p.y + t * 4.0);",
        "  vec2 d = abs(fract(q / 28.0) - 0.5);",
        "  float v = (d.x + d.y) * 1.5 - t * 0.35;",
        "  gl_FragColor = vec4(pick4(v, rgb(24, 8, 34), rgb(58, 16, 68), rgb(118, 34, 96), rgb(58, 16, 68)), 1.0);",
        "}"
      ] },

      // Pink hearts drifting over dark red, swaying, each cell cycling its own shade.
      { name: "hearts", label: "Hearts", glsl: [
        "void main() {",
        "  vec2 p = pix();",
        "  float size = 26.0;",
        "  vec2 q = p + vec2(t * 10.0, -t * 6.0);",
        "  q.x += 6.0 * sin(q.y * 0.06 + t * 1.3);",
        "  q.x += mod(floor(q.y / size), 2.0) * size * 0.5;",
        "  vec2 cell = floor(q / size);",
        "  vec2 h = (fract(q / size) - 0.5) * vec2(2.9, -2.9) + vec2(0.0, 0.3);",
        "  float a = h.x * h.x + h.y * h.y - 1.0;",
        "  bool heart = a * a * a - h.x * h.x * h.y * h.y * h.y < 0.0;",
        "  vec3 ground = pick4((p.x + p.y) / 160.0 + t * 0.05, rgb(22, 5, 14), rgb(34, 8, 22), rgb(46, 10, 30), rgb(34, 8, 22));",
        "  vec3 pink = pick4(cell.x * 0.25 + cell.y * 0.5 + t * 0.4, rgb(110, 30, 64), rgb(170, 52, 98), rgb(230, 110, 140), rgb(170, 52, 98));",
        "  gl_FragColor = vec4(heart ? pink : ground, 1.0);",
        "}"
      ] },

      // Rings from the middle in teal and gold, rippled, with a vertical wave.
      { name: "rings", label: "Rings", glsl: [
        "void main() {",
        "  vec2 p = pix();",
        "  vec2 c = p - res * 0.5;",
        "  c.y += 8.0 * sin(p.y * 0.07 + t * 1.6);",
        "  float v = length(c) / 18.0 + 0.35 * sin(atan(c.y, c.x) * 5.0 + t * 0.6) - t * 0.6;",
        "  gl_FragColor = vec4(pick4(v, rgb(8, 30, 34), rgb(20, 66, 72), rgb(112, 92, 24), rgb(20, 66, 72)), 1.0);",
        "}"
      ] },

      // Two layers at half strength: a swaying purple checkerboard over green bands that
      // wave up and down.
      { name: "plasma", label: "Plasma", glsl: [
        "void main() {",
        "  vec2 p = pix();",
        "  vec2 a = p + vec2(t * 8.0);",
        "  a.x += 10.0 * sin(a.y * 0.05 + t);",
        "  float check = mod(floor(a.x / 32.0) + floor(a.y / 32.0), 2.0);",
        "  vec3 top = check > 0.5 ? rgb(46, 22, 78) : rgb(18, 8, 36);",
        "  vec2 b = p;",
        "  b.y += 12.0 * sin(b.x * 0.04 - t * 1.3);",
        "  vec3 under = pick4(b.y / 80.0 + t * 0.2, rgb(8, 44, 26), rgb(18, 80, 44), rgb(56, 124, 52), rgb(18, 80, 44));",
        "  gl_FragColor = vec4(mix(top, under, 0.5), 1.0);",
        "}"
      ] }
    ];

    var canvas = document.getElementById("bg");
    var gl = canvas.getContext("webgl", { antialias: false, alpha: false, depth: false, preserveDrawingBuffer: false });
    var programs = {};  // compiled on first use, so only the chosen ones cost anything
    var current = null, raf = 0;
    // Frozen waves ("Disable dynamic background", remembered in this browser; at first, frozen
    // for people whose system asks for reduced motion): no motion, no bomb reaction.
    var dynamicChoice = null;
    try { dynamicChoice = localStorage.getItem("tly-bg-dynamic"); } catch (e) {}
    var still = dynamicChoice ? dynamicChoice === "off" : window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function compile(bg) {
      if (programs[bg.name]) return programs[bg.name];
      function shader(type, source) {
        var s = gl.createShader(type);
        gl.shaderSource(s, source);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(bg.name + ": " + gl.getShaderInfoLog(s));
        return s;
      }
      var program = gl.createProgram();
      gl.attachShader(program, shader(gl.VERTEX_SHADER,
        "attribute vec2 pos; void main() { gl_Position = vec4(pos, 0.0, 1.0); }"));
      gl.attachShader(program, shader(gl.FRAGMENT_SHADER, COMMON + bg.glsl.join("\n")));
      gl.bindAttribLocation(program, 0, "pos");
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(bg.name + ": " + gl.getProgramInfoLog(program));
      var locations = {};
      return programs[bg.name] = {
        program: program,
        res: gl.getUniformLocation(program, "res"),
        t: gl.getUniformLocation(program, "t"),
        loc: function (name) {
          return name in locations ? locations[name] : (locations[name] = gl.getUniformLocation(program, name));
        }
      };
    }

    if (gl) {
      // One triangle that covers the screen.
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    }

    function resize() {
      var scale = Math.max(1, window.innerHeight / LINES);
      canvas.width = Math.ceil(window.innerWidth / scale);
      canvas.height = Math.ceil(window.innerHeight / scale);
    }

    var lastNow = 0, clock = 0;
    function draw(now) {
      var p = programs[current.name];
      var dt = still ? 0 : Math.min(0.1, Math.max(0, (now - lastNow) / 1000));
      lastNow = now;
      clock = (clock + dt) % 3600;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(p.program);
      gl.uniform2f(p.res, canvas.width, canvas.height);
      gl.uniform1f(p.t, clock);
      if (current.update) current.update(p, dt);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (!still) raf = requestAnimationFrame(draw);
    }

    // ---- Waves: settings and the ?debug panel ----

    // The settings. With ?debug a panel tunes them live (kept in this browser between
    // reloads, only with ?debug); "Copy values" copies them as JSON to paste back as new
    // defaults. Distances are in canvas pixels (the canvas is `lines` high), speeds per
    // second, frequencies in radians per pixel of height.
    var PRESETS = {};
    PRESETS.a = {
      speed: 1,                 // all motion
      lines: 224,               // canvas height in pixels (SNES: 224)
      lineStep: 1,              // lines that move together (bigger = blockier waves)
      band: 33.9,               // pixels across one cycle of four stripes
      angle: 45,                // stripe direction, degrees
      palSpeed: 0.08,           // palette cycles per second (the stripes' flow)
      driftX: 0, driftY: 0,     // pattern drift, pixels per second
      swayAAmp: 10, swayAFreq: 0.045, swayASpeed: 1.1,
      swayBAmp: 4, swayBFreq: 0.11, swayBSpeed: -0.7,
      interAmp: 0, interFreq: 0.101, interSpeed: 0,
      // A bomb: the interlace amount rises to bombPeak over bombRise seconds (easing out),
      // then falls back over bombFall seconds (easing in and out); on the same curve the two
      // sways gain bombSwayA and bombSwayB
      bombPeak: 1.5, bombRise: 0.25, bombFall: 1.0, bombSwayA: 1.25, bombSwayB: 0.75,
      vertAmp: 0, vertFreq: 0.07, vertSpeed: 1.6,
      c0: "#061012", c1: "#0b2023", c2: "#14363c", c3: "#0b2023",
      bright: 1
    };
    // B: slower, no sway A, and bombs swell the sways without interlace
    PRESETS.b = {
      speed: 0.15, lines: 224, lineStep: 1, band: 33.9, angle: 45, palSpeed: 0.08,
      driftX: 0, driftY: 0,
      swayAAmp: 0, swayAFreq: 0.045, swayASpeed: 1.1,
      swayBAmp: 4, swayBFreq: 0.11, swayBSpeed: -0.7,
      interAmp: 0, interFreq: 0.101, interSpeed: 0,
      bombPeak: 0, bombRise: 0.25, bombFall: 1, bombSwayA: 1.25, bombSwayB: 2.5,
      vertAmp: 0, vertFreq: 0.07, vertSpeed: 1.6,
      c0: "#061012", c1: "#0b2023", c2: "#14363c", c3: "#0b2023",
      bright: 1
    };

    // The preset: ?preset=a, else (with ?debug) the last one picked in the panel, else B.
    // With ?debug, each preset's tweaks are kept in this browser too.
    var debug = params.has("debug");
    var preset = (params.get("preset") || "").toLowerCase();
    if (!PRESETS[preset] && debug) preset = localStorage.getItem("tly-bg-preset") || "";
    var DEFAULT_PRESET = "b";
    if (!PRESETS[preset]) preset = DEFAULT_PRESET;
    var WAVES = {};
    function loadPreset(name) {
      preset = name;
      for (var key in WAVES) delete WAVES[key];
      Object.assign(WAVES, PRESETS[name]);
      if (debug) {
        try { Object.assign(WAVES, JSON.parse(localStorage.getItem("tly-bg-" + name) || "{}")); } catch (e) {}
      }
      LINES = WAVES.lines;
    }
    loadPreset(preset);

    // Bombs going on, as their ages in seconds; the strongest sets the interlace.
    var bombs = [];
    function bombPulse() {
      var W = WAVES, level = 0;
      bombs.forEach(function (age) {
        var v;
        if (age < W.bombRise) {
          var u = age / W.bombRise;
          v = 1 - (1 - u) * (1 - u) * (1 - u);
        } else {
          var f = (age - W.bombRise) / W.bombFall;
          v = f >= 1 ? 0 : 0.5 + 0.5 * Math.cos(Math.PI * f);
        }
        level = Math.max(level, v);
      });
      return level;  // 0 to 1
    }

    // Phases add up speed x time, so changing a speed never makes the pattern jump.
    var phase = { pal: 0, driftX: 0, driftY: 0, swayA: 0, swayB: 0, inter: 0, vert: 0 };

    function hexColor(hex) {
      var n = parseInt(hex.slice(1), 16);
      return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
    }

    function updateWaves(p, dt) {
      var W = WAVES, k = dt * W.speed, TAU = Math.PI * 2;
      phase.pal = (phase.pal + k * W.palSpeed) % 1000;
      phase.driftX = (phase.driftX + k * W.driftX) % 100000;
      phase.driftY = (phase.driftY + k * W.driftY) % 100000;
      phase.swayA = (phase.swayA + k * W.swayASpeed) % (TAU * 1000);
      phase.swayB = (phase.swayB + k * W.swayBSpeed) % (TAU * 1000);
      phase.inter = (phase.inter + k * W.interSpeed) % (TAU * 1000);
      phase.vert = (phase.vert + k * W.vertSpeed) % (TAU * 1000);
      gl.uniform1f(p.loc("band"), W.band);
      gl.uniform1f(p.loc("angle"), W.angle * Math.PI / 180);
      gl.uniform1f(p.loc("pal"), phase.pal);
      gl.uniform1f(p.loc("lineStep"), Math.max(1, W.lineStep));
      gl.uniform1f(p.loc("bright"), W.bright);
      gl.uniform2f(p.loc("drift"), phase.driftX, phase.driftY);
      bombs = bombs.map(function (age) { return age + dt; })
        .filter(function (age) { return age < W.bombRise + W.bombFall; });
      var shudder = bombPulse();
      gl.uniform3f(p.loc("swayA"), W.swayAAmp + shudder * W.bombSwayA, W.swayAFreq, phase.swayA);
      gl.uniform3f(p.loc("swayB"), W.swayBAmp + shudder * W.bombSwayB, W.swayBFreq, phase.swayB);
      gl.uniform3f(p.loc("inter"), W.interAmp + shudder * W.bombPeak, W.interFreq, phase.inter);
      gl.uniform3f(p.loc("vert"), W.vertAmp, W.vertFreq, phase.vert);
      gl.uniform3fv(p.loc("c0"), hexColor(W.c0));
      gl.uniform3fv(p.loc("c1"), hexColor(W.c1));
      gl.uniform3fv(p.loc("c2"), hexColor(W.c2));
      gl.uniform3fv(p.loc("c3"), hexColor(W.c3));
    }

    // The game reports each bomb with its spot in the game's picture, 0 to 1 from the top
    // left (PageEvents.cs in the game): the waves shudder (bombPulse). The debug panel also
    // counts them.
    function bomb() {
      if (current && current.name === "waves" && !still) bombs.push(0);
    }
    var onBombDebug = function (x, y) {};
    window.addEventListener("message", function (e) {
      var d = e.data;
      if (e.source !== frame.contentWindow || !d || d.type !== "tly-bomb") return;
      bomb();
      onBombDebug(d.x, d.y);
    });

    if (debug) buildPanel();

    function buildPanel() {
      var SLIDERS = [
        ["Bomb (amounts up and back)"],
        ["bombPeak", "interlace +", 0, 40, 0.5],
        ["bombSwayA", "sway A +", -30, 30, 0.5],
        ["bombSwayB", "sway B +", -30, 30, 0.5],
        ["bombRise", "rise s", 0.02, 2, 0.01],
        ["bombFall", "fall s", 0.05, 4, 0.05],
        ["Overall"],
        ["speed", "speed", 0, 4, 0.05],
        ["lines", "lines", 56, 720, 4],
        ["lineStep", "line groups", 1, 16, 1],
        ["bright", "brightness", 0, 3, 0.05],
        ["Stripes"],
        ["band", "band", 4, 200, 0.1],
        ["angle", "angle", -90, 90, 1],
        ["palSpeed", "flow", -1, 1, 0.005],
        ["driftX", "drift x", -100, 100, 1],
        ["driftY", "drift y", -100, 100, 1],
        ["Sway A"],
        ["swayAAmp", "amount", 0, 60, 0.5],
        ["swayAFreq", "frequency", 0, 0.3, 0.001],
        ["swayASpeed", "speed", -6, 6, 0.05],
        ["Sway B"],
        ["swayBAmp", "amount", 0, 60, 0.5],
        ["swayBFreq", "frequency", 0, 0.3, 0.001],
        ["swayBSpeed", "speed", -6, 6, 0.05],
        ["Interlace (odd/even lines opposite)"],
        ["interAmp", "amount", 0, 60, 0.5],
        ["interFreq", "frequency", 0, 0.3, 0.001],
        ["interSpeed", "speed", -6, 6, 0.05],
        ["Vertical wave"],
        ["vertAmp", "amount", 0, 60, 0.5],
        ["vertFreq", "frequency", 0, 0.3, 0.001],
        ["vertSpeed", "speed", -6, 6, 0.05],
        ["Palette (four steps)"],
        ["c0", "1"], ["c1", "2"], ["c2", "3"], ["c3", "4"]
      ];
      var panel = document.createElement("div");
      panel.id = "debug";
      var title = document.createElement("div");
      title.innerHTML = "<b>Background</b> <small id=\"bombs\">bombs: 0</small>";
      panel.appendChild(title);
      // Preset buttons: switching keeps each one's tweaks; * marks a tweaked one.
      var presetRow = document.createElement("div");
      presetRow.className = "buttons presets";
      var presetButtons = {};
      Object.keys(PRESETS).forEach(function (name) {
        var b = document.createElement("button");
        b.type = "button";
        b.addEventListener("click", function () {
          loadPreset(name);
          localStorage.setItem("tly-bg-preset", name);
          var q = new URLSearchParams(location.search);
          if (name === DEFAULT_PRESET) q.delete("preset"); else q.set("preset", name);
          history.replaceState(null, "", q.toString() ? "?" + q : location.pathname);
          updateRulesLink();
          for (var key in inputs) inputs[key]();
          apply("lines");
          markPresets();
        });
        presetRow.appendChild(b);
        presetButtons[name] = b;
      });
      function markPresets() {
        for (var name in presetButtons) {
          var saved = localStorage.getItem("tly-bg-" + name);
          var tweaked = saved && saved !== JSON.stringify(PRESETS[name]);
          presetButtons[name].textContent = "Preset " + name.toUpperCase() + (tweaked ? " *" : "");
          presetButtons[name].setAttribute("aria-pressed", name === preset ? "true" : "false");
        }
      }
      panel.appendChild(presetRow);

      var bombCount = 0, bombLabel = title.querySelector("#bombs"), timer = 0;
      onBombDebug = function (x, y) {
        bombCount++;
        bombLabel.textContent = "bombs: " + bombCount + " (last at " + x.toFixed(2) + ", " + y.toFixed(2) + ")";
        bombLabel.style.color = "#ffd23f";
        clearTimeout(timer);
        timer = setTimeout(function () { bombLabel.style.color = ""; }, 400);
      };
      var inputs = {};
      function save() {
        localStorage.setItem("tly-bg-" + preset, JSON.stringify(WAVES));
        markPresets();
      }
      function apply(key) {
        if (key === "lines") { LINES = WAVES.lines; resize(); }
      }
      SLIDERS.forEach(function (row) {
        if (row.length === 1) {
          var h = document.createElement("div");
          h.className = "head";
          h.textContent = row[0];
          panel.appendChild(h);
          return;
        }
        var key = row[0], label = document.createElement("label");
        var input = document.createElement("input"), value = document.createElement("span");
        if (row.length === 2) {
          input.type = "color";
        } else {
          input.type = "range";
          input.min = row[2]; input.max = row[3]; input.step = row[4];
        }
        label.appendChild(document.createTextNode(row[1]));
        label.appendChild(input);
        label.appendChild(value);
        function show() { input.value = WAVES[key]; value.textContent = input.type === "range" ? WAVES[key] : WAVES[key]; }
        input.addEventListener("input", function () {
          WAVES[key] = input.type === "range" ? parseFloat(input.value) : input.value;
          value.textContent = WAVES[key];
          apply(key);
          save();
        });
        // Double-click a row: back to its default
        label.addEventListener("dblclick", function () {
          WAVES[key] = PRESETS[preset][key];
          show(); apply(key); save();
        });
        inputs[key] = show;
        show();
        panel.appendChild(label);
      });
      var buttons = document.createElement("div");
      buttons.className = "buttons";
      function button(text, onClick) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = text;
        b.addEventListener("click", function () { onClick(b); });
        buttons.appendChild(b);
      }
      button("Test bomb", function () { bomb(); });
      button("Copy values", function (b) {
        var text = JSON.stringify(WAVES, null, 2);
        console.log(text);
        var done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy values"; }, 1200); };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { b.textContent = "See console"; });
        else b.textContent = "See console";
      });
      button("Reset all", function () {
        localStorage.removeItem("tly-bg-" + preset);
        loadPreset(preset);
        for (var key in inputs) inputs[key]();
        apply("lines");
        markPresets();
      });
      panel.appendChild(buttons);
      markPresets();
      var hint = document.createElement("small");
      hint.textContent = "Double-click a row to reset it.";
      panel.appendChild(hint);
      document.body.appendChild(panel);
    }

    var picker = document.getElementById("picker");
    var buttons = {};

    function choose(name, remember) {
      var bg = BACKGROUNDS.filter(function (b) { return b.name === name; })[0] || BACKGROUNDS[0];
      if (bg.glsl && gl) {
        try { compile(bg); } catch (e) { console.error(e); bg = BACKGROUNDS[0]; }
      } else if (bg.glsl) {
        bg = BACKGROUNDS[0];  // no WebGL
      }
      current = bg;
      cancelAnimationFrame(raf);
      document.documentElement.classList.toggle("shader", !!bg.glsl);
      if (bg.glsl) { resize(); draw(performance.now()); }
      for (var key in buttons) buttons[key].setAttribute("aria-pressed", key === bg.name ? "true" : "false");
      if (remember) {
        var p = new URLSearchParams(location.search);
        if (bg.name === "waves") p.delete("bg"); else p.set("bg", bg.name);
        history.replaceState(null, "", p.toString() ? "?" + p : location.pathname);
        updateRulesLink();
      }
    }

    // The picker row is hidden (Waves won); add <div id="picker">Background:</div> under the
    // footer to bring it back. ?bg=NAME still picks one.
    if (picker) BACKGROUNDS.forEach(function (bg) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = bg.label;
      b.addEventListener("click", function () { choose(bg.name, true); });
      picker.appendChild(b);
      buttons[bg.name] = b;
    });

    var dynamicButton = document.getElementById("dynamic");
    function setStill(on, remember) {
      still = on;
      document.documentElement.classList.toggle("still", on);
      dynamicButton.textContent = on ? "Enable dynamic background" : "Disable dynamic background";
      if (remember) {
        try { localStorage.setItem("tly-bg-dynamic", on ? "off" : "on"); } catch (e) {}
      }
      if (!current || !current.glsl) return;
      cancelAnimationFrame(raf);
      if (on) bombs = [];  // the shudder stops too
      lastNow = performance.now();
      draw(lastNow);  // frozen: draws this frame once; moving: starts the loop again
    }
    dynamicButton.addEventListener("click", function () { setStill(!still, true); });

    window.addEventListener("resize", function () {
      if (current && current.glsl) { resize(); if (still) draw(performance.now()); }
    });

    choose(params.get("bg") || "waves", false);
    setStill(still, false);
  })();
</script>
</body>
</html>
